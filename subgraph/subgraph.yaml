specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: PrimeDeskGateway
    network: sepolia
    source:
      address: "{{GATEWAY_ADDRESS}}"
      abi: AquaPrimeSwapGateway
      startBlock: {{START_BLOCK}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Maker
        - Strategy
        - Swap
      abis:
        - name: AquaPrimeSwapGateway
          file: ./abis/AquaPrimeSwapGateway.json
      eventHandlers:
        - event: DeskShipped(indexed address,indexed bytes32,indexed address,address,uint256,uint256,string)
          handler: handleDeskShipped
        - event: SwapRouted(indexed address,indexed address,bool,uint256,uint256,uint8,uint256,uint256,uint256)
          handler: handleSwapRouted
      file: ./src/mapping.ts
